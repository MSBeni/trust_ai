{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trustai-api
  labels:
    app.kubernetes.io/name: trustai
    app.kubernetes.io/component: api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: trustai
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingress.namespace | quote }}
      ports:
        - protocol: TCP
          port: {{ .Values.api.port }}
  egress:
{{- if .Values.networkPolicy.egress.allowDns }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
{{- range .Values.networkPolicy.egress.allowedCidrs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
{{- end }}
{{- end }}
