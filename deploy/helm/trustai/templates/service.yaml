apiVersion: v1
kind: Service
metadata:
  name: trustai-api
  labels:
    app.kubernetes.io/name: trustai
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  selector:
    app.kubernetes.io/name: trustai
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
