image:
  repository: trustai
  tag: "0.1.0"
  pullPolicy: IfNotPresent

tenantId: local
signingKeySecretName: trustai-signing-key

storage:
  enabled: true
  size: 1Gi
  mountPath: /data

demo:
  enabled: true
  statePath: /data/evidence-chain.json
  outputPath: /data/aitrade-proof-pack.json
  pdfPath: /data/aitrade-proof-pack.pdf
api:
  replicas: 1
  port: 8080
  statePath: /data/server/evidence-chain.json
  controlDbPath: /data/server/control-plane.sqlite
  approvalRequestStorePath: /data/server/approval-requests.json
  providerWebhookStorePath: /data/server/provider-webhooks.json
  service:
    type: ClusterIP
    port: 8080
  readinessProbe:
    initialDelaySeconds: 3
    periodSeconds: 10
  livenessProbe:
    initialDelaySeconds: 10
    periodSeconds: 20
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

networkPolicy:
  enabled: true
  ingress:
    namespace: default
  egress:
    allowDns: true
    allowedCidrs:
      - 10.0.0.0/8
