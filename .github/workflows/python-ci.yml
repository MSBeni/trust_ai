name: Python CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Demo proof-pack smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install TrustAI package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Compile source and tests
        run: python -m compileall -q src tests

      - name: Generate bundled aitrade proof pack
        run: python -m trustai demo

      - name: Verify bundled proof pack offline
        run: python -m trustai verify artifacts/aitrade-proof-pack.json

      - name: Generate roadmap audit
        run: python -m trustai roadmap-audit --out artifacts/roadmap-audit.json --markdown artifacts/roadmap-audit.md

      - name: Verify roadmap audit
        run: python -m trustai roadmap-audit-verify artifacts/roadmap-audit.json

      - name: Append roadmap audit to evidence chain
        run: python -m trustai roadmap-audit-append artifacts/roadmap-audit.json --state .trustai/roadmap-audit-ci/evidence-chain.json --tenant roadmap-audit-ci --out artifacts/roadmap-audit-entry.json

      - name: Verify roadmap audit evidence chain
        run: python -m trustai chain-verify --state .trustai/roadmap-audit-ci/evidence-chain.json --tenant roadmap-audit-ci

      - name: Generate external evidence manifest
        run: python -m trustai external-evidence-manifest artifacts/roadmap-audit.json --require-fresh --require-live-source-uris --now 2026-07-12T00:00:00Z --evidence "oss-verifier-and-public-spec,ci-run,examples/aitrade/external-evidence/go-verifier-workflow-run.json,Recorded Go verifier workflow export;issuer=GitHub Actions;subject=trustai go verifier release workflow;source_uri=https://github.com/MSBeni/trust_ai/actions;issued_at=2026-07-08T00:00:00Z;expires_at=2026-12-31T00:00:00Z" --out artifacts/external-evidence-manifest.json --markdown artifacts/external-evidence-manifest.md

      - name: Verify external evidence manifest
        run: python -m trustai external-evidence-verify artifacts/external-evidence-manifest.json artifacts/roadmap-audit.json --require-fresh --require-live-source-uris --now 2026-07-12T00:00:00Z

      - name: Generate external evidence collection plan
        run: python -m trustai external-evidence-plan artifacts/external-evidence-manifest.json artifacts/roadmap-audit.json --out artifacts/external-evidence-plan.json --markdown artifacts/external-evidence-plan.md

      - name: Verify external evidence collection plan
        run: python -m trustai external-evidence-plan-verify artifacts/external-evidence-plan.json artifacts/external-evidence-manifest.json artifacts/roadmap-audit.json

      - name: Generate all-authority external evidence collection plan
        run: python -m trustai external-evidence-plan artifacts/external-evidence-manifest.json artifacts/roadmap-audit.json --status-filter all --out artifacts/external-evidence-plan-all.json --markdown artifacts/external-evidence-plan-all.md

      - name: Collect external evidence source and intake receipt
        run: python -m trustai external-evidence-collect artifacts/external-evidence-plan-all.json artifacts/external-evidence-manifest.json artifacts/roadmap-audit.json https://github.com/MSBeni/trust_ai/actions --task oss-verifier-and-public-spec:ci-run --source-file examples/aitrade/external-evidence/go-verifier-workflow-run.json --description "Snapshot of recorded verifier workflow run export" --issuer "GitHub Actions" --subject "trustai go verifier release workflow" --content-type application/json --issued-at 2026-07-08T00:00:00Z --expires-at 2026-12-31T00:00:00Z --snapshot-out artifacts/external-evidence-source-snapshot.json --intake-out artifacts/external-evidence-intake.json --require-fresh --now 2026-07-12T00:00:00Z

      - name: Verify external evidence source snapshot
        run: python -m trustai external-evidence-snapshot-verify artifacts/external-evidence-source-snapshot.json --require-fresh --now 2026-07-12T00:00:00Z

      - name: Verify external evidence intake receipt
        run: python -m trustai external-evidence-intake-verify artifacts/external-evidence-intake.json artifacts/external-evidence-plan-all.json artifacts/external-evidence-manifest.json artifacts/roadmap-audit.json --require-fresh --require-source-snapshot-artifact --require-fresh-source-snapshot-artifact --now 2026-07-12T00:00:00Z

      - name: Create retained git-ref external evidence intake receipt
        run: python -m trustai external-evidence-intake artifacts/external-evidence-plan-all.json artifacts/external-evidence-manifest.json artifacts/roadmap-audit.json --root . --task oss-verifier-and-public-spec:provider-api --artifact examples/aitrade/external-evidence/github-main-ref-source-snapshot.json --description "GitHub remote main ref advertisement for pushed TrustAI checkpoint" --issuer "GitHub Git" --subject "MSBeni/trust_ai main branch" --source-uri "git+https://github.com/MSBeni/trust_ai.git#refs/heads/main" --issued-at 2026-07-12T00:00:00Z --expires-at 2026-12-31T00:00:00Z --require-fresh --require-source-snapshot-artifact --require-fresh-source-snapshot-artifact --now 2026-07-12T00:00:00Z --out artifacts/external-evidence-provider-api-intake.json

      - name: Verify retained git-ref external evidence intake receipt
        run: python -m trustai external-evidence-intake-verify artifacts/external-evidence-provider-api-intake.json artifacts/external-evidence-plan-all.json artifacts/external-evidence-manifest.json artifacts/roadmap-audit.json --root . --require-fresh --require-source-snapshot-artifact --require-fresh-source-snapshot-artifact --now 2026-07-12T00:00:00Z

      - name: Create retained hosted-service external evidence intake receipt
        run: python -m trustai external-evidence-intake artifacts/external-evidence-plan-all.json artifacts/external-evidence-manifest.json artifacts/roadmap-audit.json --root . --task oss-verifier-and-public-spec:hosted-service --artifact examples/aitrade/external-evidence/github-hosted-service-source-snapshot.json --description "GitHub hosted git service remote advertisement for TrustAI verifier and spec repository" --issuer "GitHub Git" --subject "MSBeni/trust_ai hosted repository service" --source-uri "git+https://github.com/MSBeni/trust_ai.git#HEAD" --issued-at 2026-07-12T00:00:00Z --expires-at 2026-12-31T00:00:00Z --require-fresh --require-source-snapshot-artifact --require-fresh-source-snapshot-artifact --now 2026-07-12T00:00:00Z --out artifacts/external-evidence-hosted-service-intake.json

      - name: Verify retained hosted-service external evidence intake receipt
        run: python -m trustai external-evidence-intake-verify artifacts/external-evidence-hosted-service-intake.json artifacts/external-evidence-plan-all.json artifacts/external-evidence-manifest.json artifacts/roadmap-audit.json --root . --require-fresh --require-source-snapshot-artifact --require-fresh-source-snapshot-artifact --now 2026-07-12T00:00:00Z

      - name: Stage external evidence intake directory
        run: mkdir -p artifacts/external-evidence-intakes && cp artifacts/external-evidence-intake.json artifacts/external-evidence-intakes/oss-verifier-ci-run.json && cp artifacts/external-evidence-provider-api-intake.json artifacts/external-evidence-intakes/oss-verifier-provider-api.json && cp artifacts/external-evidence-hosted-service-intake.json artifacts/external-evidence-intakes/oss-verifier-hosted-service.json

      - name: Rebuild external evidence manifest from intake receipts
        run: python -m trustai external-evidence-manifest-from-intakes artifacts/external-evidence-plan-all.json artifacts/external-evidence-manifest.json artifacts/roadmap-audit.json --intake-dir artifacts/external-evidence-intakes --require-fresh --require-live-source-uris --require-source-snapshot-artifacts --require-fresh-source-snapshot-artifacts --now 2026-07-12T00:00:00Z --out artifacts/external-evidence-manifest-from-intakes.json --markdown artifacts/external-evidence-manifest-from-intakes.md

      - name: Verify rebuilt external evidence manifest from intake receipts
        run: python -m trustai external-evidence-verify artifacts/external-evidence-manifest-from-intakes.json artifacts/roadmap-audit.json --require-fresh --require-live-source-uris --require-source-snapshot-artifacts --require-fresh-source-snapshot-artifacts --now 2026-07-12T00:00:00Z

      - name: Check rebuilt external evidence authority coverage
        run: >
          python -c "import json; m=json.load(open('artifacts/external-evidence-manifest-from-intakes.json', encoding='utf-8')); s=m['summary']; assert s['required_authority_kind_count'] == 71, s; assert s['covered_authority_kind_count'] == 3, s; assert s['missing_authority_kind_count'] == 68, s"

      - name: Verify retained external evidence worklist artifacts
        run: |
          python -m trustai external-evidence-verify examples/aitrade/external-evidence/retained-external-evidence-manifest.json examples/aitrade/external-evidence/source-roadmap-audit.json --require-fresh --require-live-source-uris --require-source-snapshot-artifacts --require-fresh-source-snapshot-artifacts --now 2026-07-12T00:00:00Z
          python -m trustai external-evidence-plan-verify examples/aitrade/external-evidence/remaining-external-evidence-plan.json examples/aitrade/external-evidence/retained-external-evidence-manifest.json examples/aitrade/external-evidence/source-roadmap-audit.json
          python -m trustai external-evidence-source-map-verify examples/aitrade/external-evidence/remaining-external-evidence-source-map-template.json examples/aitrade/external-evidence/remaining-external-evidence-plan.json
          python -m trustai external-evidence-collect-batch-verify examples/aitrade/external-evidence/retained-external-evidence-collection-run.json examples/aitrade/external-evidence/source-external-evidence-plan-all.json examples/aitrade/external-evidence/source-external-evidence-manifest.json examples/aitrade/external-evidence/source-roadmap-audit.json --root . --source-map examples/aitrade/external-evidence/retained-external-evidence-collected-source-map.json --require-fresh --require-live-source-uris --require-fresh-source-snapshot-artifacts --now 2026-07-12T00:00:00Z
          python -m trustai external-evidence-gap-report-verify examples/aitrade/external-evidence/retained-external-evidence-gap-report.json examples/aitrade/external-evidence/retained-external-evidence-manifest.json examples/aitrade/external-evidence/remaining-external-evidence-plan.json examples/aitrade/external-evidence/remaining-external-evidence-source-map-template.json examples/aitrade/external-evidence/source-roadmap-audit.json --root . --require-fresh --now 2026-07-12T00:00:00Z
          python -m trustai external-evidence-work-package-verify examples/aitrade/external-evidence/remaining-external-evidence-work-package.json examples/aitrade/external-evidence/retained-external-evidence-gap-report.json examples/aitrade/external-evidence/retained-external-evidence-manifest.json examples/aitrade/external-evidence/remaining-external-evidence-plan.json examples/aitrade/external-evidence/remaining-external-evidence-source-map-template.json examples/aitrade/external-evidence/source-roadmap-audit.json --root .
          python -m trustai external-evidence-readiness examples/aitrade/external-evidence/retained-external-evidence-gap-report.json examples/aitrade/external-evidence/retained-external-evidence-manifest.json examples/aitrade/external-evidence/remaining-external-evidence-plan.json examples/aitrade/external-evidence/remaining-external-evidence-source-map-template.json examples/aitrade/external-evidence/source-roadmap-audit.json --work-package examples/aitrade/external-evidence/remaining-external-evidence-work-package.json --root . --require-fresh --now 2026-07-12T00:00:00Z --out artifacts/external-evidence-readiness.json --markdown artifacts/external-evidence-readiness.md
          python -m trustai external-evidence-readiness-verify artifacts/external-evidence-readiness.json examples/aitrade/external-evidence/retained-external-evidence-gap-report.json examples/aitrade/external-evidence/retained-external-evidence-manifest.json examples/aitrade/external-evidence/remaining-external-evidence-plan.json examples/aitrade/external-evidence/remaining-external-evidence-source-map-template.json examples/aitrade/external-evidence/source-roadmap-audit.json --work-package examples/aitrade/external-evidence/remaining-external-evidence-work-package.json --root .
          python -c "import json; m=json.load(open('examples/aitrade/external-evidence/retained-external-evidence-manifest.json', encoding='utf-8')); p=json.load(open('examples/aitrade/external-evidence/remaining-external-evidence-plan.json', encoding='utf-8')); sm=json.load(open('examples/aitrade/external-evidence/remaining-external-evidence-source-map-template.json', encoding='utf-8')); gr=json.load(open('examples/aitrade/external-evidence/retained-external-evidence-gap-report.json', encoding='utf-8')); wp=json.load(open('examples/aitrade/external-evidence/remaining-external-evidence-work-package.json', encoding='utf-8')); assert m['summary']['covered_authority_kind_count'] == 52, m['summary']; assert m['summary']['missing_authority_kind_count'] == 19, m['summary']; assert p['summary']['selected_task_count'] == 19, p['summary']; assert sm['summary']['entry_count'] == 19, sm['summary']; assert sm['summary']['placeholder_source_uri_count'] == 19, sm['summary']; assert sm['summary']['live_source_uri_count'] == 0, sm['summary']; assert gr['summary']['covered_authority_kind_count'] == 52, gr['summary']; assert gr['summary']['missing_authority_kind_count'] == 19, gr['summary']; assert gr['summary']['remaining_task_count'] == 19, gr['summary']; assert gr['summary']['source_map_entry_count'] == 19, gr['summary']; assert gr['summary']['placeholder_source_uri_count'] == 19, gr['summary']; assert gr['summary']['live_source_uri_count'] == 0, gr['summary']; assert gr['verification_options']['require_live_source_uris'] is False, gr['verification_options']; assert gr['verification_options']['require_source_snapshots'] is False, gr['verification_options']; assert gr['verification_options']['require_fresh_source_snapshots'] is False, gr['verification_options']; assert wp['schema'] == 'trustai.external-evidence-work-package/0.1', wp['schema']; assert wp['summary']['task_count'] == 19, wp['summary']; assert wp['summary']['missing_task_count'] == 19, wp['summary']; assert wp['summary']['placeholder_source_uri_count'] == 19, wp['summary']; assert wp['summary']['live_source_uri_count'] == 0, wp['summary']; assert wp['summary']['package_count'] == 9, wp['summary']"

      - name: Verify retained external evidence regeneration tool
        run: python scripts/regenerate_retained_external_evidence.py --verify-only

      - name: Append retained external evidence collection run to evidence chain
        run: |
          python -m trustai roadmap-audit-append examples/aitrade/external-evidence/source-roadmap-audit.json --state .trustai/retained-collection-run-ci/evidence-chain.json --tenant retained-collection-run-ci --out artifacts/retained-collection-run-audit-entry.json
          python -m trustai external-evidence-collect-batch-append examples/aitrade/external-evidence/retained-external-evidence-collection-run.json examples/aitrade/external-evidence/source-external-evidence-plan-all.json examples/aitrade/external-evidence/source-external-evidence-manifest.json examples/aitrade/external-evidence/source-roadmap-audit.json --root . --source-map examples/aitrade/external-evidence/retained-external-evidence-collected-source-map.json --require-fresh --require-live-source-uris --require-fresh-source-snapshot-artifacts --now 2026-07-12T00:00:00Z --state .trustai/retained-collection-run-ci/evidence-chain.json --tenant retained-collection-run-ci --out artifacts/retained-external-evidence-collection-run-entry.json
          python -m trustai roadmap-evidence-verify --state .trustai/retained-collection-run-ci/evidence-chain.json --tenant retained-collection-run-ci
          python -m trustai roadmap-evidence-report --state .trustai/retained-collection-run-ci/evidence-chain.json --tenant retained-collection-run-ci --out artifacts/retained-collection-run-roadmap-evidence-report.json --markdown artifacts/retained-collection-run-roadmap-evidence-report.md
          python -m trustai roadmap-evidence-bundle --state .trustai/retained-collection-run-ci/evidence-chain.json --tenant retained-collection-run-ci --report artifacts/retained-collection-run-roadmap-evidence-report.json --root . --source-artifact "roadmap-audit,examples/aitrade/external-evidence/source-roadmap-audit.json,Retained source roadmap audit JSON" --source-artifact "external-evidence-collection-run,examples/aitrade/external-evidence/retained-external-evidence-collection-run.json,Retained collection-run report JSON" --include-collection-run-artifacts --require-source-artifacts --out artifacts/retained-collection-run-roadmap-evidence-bundle.json --markdown artifacts/retained-collection-run-roadmap-evidence-bundle.md
          python -m trustai roadmap-evidence-bundle-verify artifacts/retained-collection-run-roadmap-evidence-bundle.json --require-source-artifacts
          python -c "import json; e=json.load(open('artifacts/retained-external-evidence-collection-run-entry.json', encoding='utf-8')); b=json.load(open('artifacts/retained-collection-run-roadmap-evidence-bundle.json', encoding='utf-8')); assert e['entry_type'] == 'trustai.external_evidence_collection_run.attested', e; assert e['payload']['collected_count'] == 52, e['payload']; assert e['payload']['require_source_snapshot_artifacts'] is True, e['payload']; assert b['summary']['source_artifact_count'] == 107, b['summary']"
      - name: Append external evidence manifest to evidence chain
        run: python -m trustai external-evidence-append artifacts/external-evidence-manifest-from-intakes.json artifacts/roadmap-audit.json --require-fresh --require-live-source-uris --require-source-snapshot-artifacts --require-fresh-source-snapshot-artifacts --now 2026-07-12T00:00:00Z --state .trustai/roadmap-audit-ci/evidence-chain.json --tenant roadmap-audit-ci --out artifacts/external-evidence-entry.json

      - name: Verify roadmap evidence chain semantics
        run: python -m trustai roadmap-evidence-verify --state .trustai/roadmap-audit-ci/evidence-chain.json --tenant roadmap-audit-ci --require-external --require-fresh

      - name: Generate roadmap evidence report
        run: python -m trustai roadmap-evidence-report --state .trustai/roadmap-audit-ci/evidence-chain.json --tenant roadmap-audit-ci --require-external --require-fresh --out artifacts/roadmap-evidence-report.json --markdown artifacts/roadmap-evidence-report.md

      - name: Verify roadmap evidence report
        run: python -m trustai roadmap-evidence-report-verify artifacts/roadmap-evidence-report.json --state .trustai/roadmap-audit-ci/evidence-chain.json --tenant roadmap-audit-ci --require-external --require-fresh

      - name: Generate roadmap evidence bundle
        run: python -m trustai roadmap-evidence-bundle --state .trustai/roadmap-audit-ci/evidence-chain.json --tenant roadmap-audit-ci --require-external --require-fresh --report artifacts/roadmap-evidence-report.json --root . --source-artifact "roadmap-audit,artifacts/roadmap-audit.json,Generated roadmap audit JSON" --source-artifact "external-evidence-manifest,artifacts/external-evidence-manifest-from-intakes.json,Generated external evidence manifest JSON" --include-manifest-evidence --require-source-artifacts --out artifacts/roadmap-evidence-bundle.json --markdown artifacts/roadmap-evidence-bundle.md

      - name: Verify roadmap evidence bundle
        run: python -m trustai roadmap-evidence-bundle-verify artifacts/roadmap-evidence-bundle.json --require-external --require-fresh --require-source-artifacts

      - name: Extract roadmap evidence bundle sources
        run: python -m trustai roadmap-evidence-bundle-extract artifacts/roadmap-evidence-bundle.json --out-dir artifacts/roadmap-evidence-bundle-sources --require-external --require-fresh --require-source-artifacts

      - name: Verify unittest discovery
        run: python -m unittest discover -v -p test_repository_ci.py

      - name: Run clean-checkout smoke tests
        run: >
          python -m unittest -v
          tests.test_proofpack_flow
          tests.test_ingest_runtime
          tests.test_reexecution
          tests.test_verifier_release
          tests.test_verifier_distribution
          tests.test_go_verifier_source
          tests.test_go_verifier_build
          tests.test_go_verifier_release_workflow
          tests.test_deployment
          tests.test_byoc_operator
          tests.test_byoc_authority
          tests.test_repository_ci
          tests.test_packaging
          tests.test_roadmap_audit
          tests.test_external_evidence
          tests.test_tamper_stress
          tests.test_standards
