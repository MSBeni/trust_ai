name: Python CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Demo proof-pack smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install TrustAI package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Compile source and tests
        run: python -m compileall -q src tests

      - name: Generate bundled aitrade proof pack
        run: python -m trustai demo

      - name: Verify bundled proof pack offline
        run: python -m trustai verify artifacts/aitrade-proof-pack.json

      - name: Generate roadmap audit
        run: python -m trustai roadmap-audit --out artifacts/roadmap-audit.json --markdown artifacts/roadmap-audit.md

      - name: Verify roadmap audit
        run: python -m trustai roadmap-audit-verify artifacts/roadmap-audit.json

      - name: Append roadmap audit to evidence chain
        run: python -m trustai roadmap-audit-append artifacts/roadmap-audit.json --state .trustai/roadmap-audit-ci/evidence-chain.json --tenant roadmap-audit-ci --out artifacts/roadmap-audit-entry.json

      - name: Verify roadmap audit evidence chain
        run: python -m trustai chain-verify --state .trustai/roadmap-audit-ci/evidence-chain.json --tenant roadmap-audit-ci

      - name: Generate external evidence manifest
        run: python -m trustai external-evidence-manifest artifacts/roadmap-audit.json --evidence "oss-verifier-and-public-spec,ci-run,examples/aitrade/external-evidence/go-verifier-workflow-run.json,Recorded Go verifier workflow export" --out artifacts/external-evidence-manifest.json --markdown artifacts/external-evidence-manifest.md

      - name: Verify external evidence manifest
        run: python -m trustai external-evidence-verify artifacts/external-evidence-manifest.json artifacts/roadmap-audit.json

      - name: Append external evidence manifest to evidence chain
        run: python -m trustai external-evidence-append artifacts/external-evidence-manifest.json artifacts/roadmap-audit.json --state .trustai/roadmap-audit-ci/evidence-chain.json --tenant roadmap-audit-ci --out artifacts/external-evidence-entry.json

      - name: Verify roadmap evidence chain semantics
        run: python -m trustai roadmap-evidence-verify --state .trustai/roadmap-audit-ci/evidence-chain.json --tenant roadmap-audit-ci --require-external

      - name: Generate roadmap evidence report
        run: python -m trustai roadmap-evidence-report --state .trustai/roadmap-audit-ci/evidence-chain.json --tenant roadmap-audit-ci --require-external --out artifacts/roadmap-evidence-report.json --markdown artifacts/roadmap-evidence-report.md

      - name: Verify roadmap evidence report
        run: python -m trustai roadmap-evidence-report-verify artifacts/roadmap-evidence-report.json --state .trustai/roadmap-audit-ci/evidence-chain.json --tenant roadmap-audit-ci --require-external

      - name: Generate roadmap evidence bundle
        run: python -m trustai roadmap-evidence-bundle --state .trustai/roadmap-audit-ci/evidence-chain.json --tenant roadmap-audit-ci --require-external --report artifacts/roadmap-evidence-report.json --root . --source-artifact "roadmap-audit,artifacts/roadmap-audit.json,Generated roadmap audit JSON" --source-artifact "external-evidence-manifest,artifacts/external-evidence-manifest.json,Generated external evidence manifest JSON" --include-manifest-evidence --out artifacts/roadmap-evidence-bundle.json --markdown artifacts/roadmap-evidence-bundle.md

      - name: Verify roadmap evidence bundle
        run: python -m trustai roadmap-evidence-bundle-verify artifacts/roadmap-evidence-bundle.json --require-external

      - name: Run clean-checkout smoke tests
        run: >
          python -m unittest -v
          tests.test_proofpack_flow
          tests.test_ingest_runtime
          tests.test_reexecution
          tests.test_verifier_release
          tests.test_verifier_distribution
          tests.test_go_verifier_source
          tests.test_go_verifier_build
          tests.test_go_verifier_release_workflow
          tests.test_repository_ci
          tests.test_roadmap_audit
          tests.test_external_evidence
          tests.test_standards
